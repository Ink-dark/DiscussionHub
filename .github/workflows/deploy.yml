name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时自动创建（GITHUB_TOKEN 已声明 pages: write）
          enablement: true

      - name: Build
        env:
          # 项目页必须带仓库名子路径，否则静态资源 404
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_ROOMS: ${{ vars.VITE_GITHUB_ROOMS }}
          VITE_OAUTH_EXCHANGE_URL: ${{ vars.VITE_OAUTH_EXCHANGE_URL }}
        run: npm run build

      - name: Ensure .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
